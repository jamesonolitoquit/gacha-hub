name: Generate seed SQL preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/seeds/**'
      - 'scripts/**'

jobs:
  seed-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Generate seed SQL preview
        run: |
          npm run prune:seeds || true
          npm run --silent seed:db
      - name: Upload SQL preview
        uses: actions/upload-artifact@v4
        with:
          name: seed-upserts-sql
          path: data/seeds/sql/seed-upserts.sql
